name: Test release

# A test build of the plugin, for trying before everyone gets it: pushing to the testing branch builds it as
# <version>.<run number> (1.0.2.7 for 1.0.2) and offers it in repo.json as the plugin's testing version. Only
# players who opted in to the plugin's testing builds in Dalamud get it; everyone else stays on the normal version.
# The next normal release of that version (release.yml) is numbered above the last test build, so testers get it too.
#
# Needs the RELEASES_TOKEN secret, as release.yml does. Without it nothing is published (the step says so).
on:
  push:
    branches: [ testing ]

permissions:
  contents: write

# One publishing run at a time (this and release.yml both write repo.json): a second waits, never cancels.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    # No token here: the build runs other people's code (NuGet packages, Dalamud), which must not reach the publishing one.
    # The Sub Calculator's loot and breakpoints, read again from XIVStats and Pepper's guide (with the app's script, from
    # its branch of the same name or main) so each build ships the latest. When they can't be read, the copy in the
    # repository is used and a warning says so; it never stops the build.
    - name: Which app branch to refresh the Sub Calculator data with
      id: app
      shell: bash
      run: |
        branch="${GITHUB_REF_NAME}"
        if git ls-remote --exit-code --heads https://github.com/CrownedPandaXIV/XIVFleetCompanion-App.git "$branch" > /dev/null; then
          echo "ref=$branch" >> "$GITHUB_OUTPUT"
        else
          echo "ref=main" >> "$GITHUB_OUTPUT"
        fi

    - name: Get the app
      uses: actions/checkout@v5
      with:
        repository: CrownedPandaXIV/XIVFleetCompanion-App
        ref: ${{ steps.app.outputs.ref }}
        path: app
        persist-credentials: false

    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Refresh the Sub Calculator data
      shell: bash
      run: |
        if [ -f app/.github/scripts/refresh-sub-data.js ]; then
          node app/.github/scripts/refresh-sub-data.js XIVFleetCompanion/SubCalculatorData.json
        else
          echo "::warning title=Sub Calculator data::The app's ${{ steps.app.outputs.ref }} has no refresh script yet; the plugin's copy is used."
        fi
        rm -rf app

    - name: Build the test build
      id: build
      shell: bash
      run: |
        version=$(grep -oPm1 '(?<=<Version>)[^<]+' XIVFleetCompanion/XIVFleetCompanion.csproj)
        build="${version}.${GITHUB_RUN_NUMBER}"
        echo "Test build: ${build}"
        echo "build=${build}" >> "$GITHUB_OUTPUT"
        dotnet build --configuration Release -p:Version="${build}"

    - name: Publish the test build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      run: |
        if [ -z "$RELEASES_TOKEN" ]; then echo "No RELEASES_TOKEN secret: the test build is not published."; exit 0; fi
        bash .github/scripts/publish-testing.sh "${{ steps.build.outputs.build }}"
